name: Public installer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install focused test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats minisign shellcheck
      - name: Validate public installer
        run: |
          bash -n install.sh
          shellcheck install.sh
          python3 -m py_compile lib/verify_release.py
          python3 -m json.tool versions.json >/dev/null
          bats tests/test_public_installer.bats

  addon-hy2hop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Hysteria2 port-hopping add-on
        run: |
          bash -n addons/hy2hop/bootstrap.sh
          shellcheck addons/hy2hop/bootstrap.sh
          python3 -m py_compile addons/hy2hop/hkit-hy2hop.py
          cd addons/hy2hop && python3 -m unittest discover -s tests -v
